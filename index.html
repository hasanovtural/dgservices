<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mygov · İnteqrasiya paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#f7f8fb; --surface-3:#eef1f6;
  --border:#e3e7ee; --border-strong:#cfd6e1;
  --text:#0f172a; --text-2:#475569; --text-3:#7a869a;
  --brand:#2a78d6; --brand-strong:#1c5cab; --brand-soft:#e7f0fc;
  --s-api:#2a78d6; --s-iframe:#eb6834; --s-mobile:#1baf7a;
  --s-api-soft:#e7f0fc; --s-iframe-soft:#fdeee7; --s-mobile-soft:#e3f6ee;
  --warn:#b45309; --warn-soft:#fff4e0;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1116; --surface:#161a21; --surface-2:#1b2029; --surface-3:#222834;
    --border:#2a313d; --border-strong:#38404e;
    --text:#eef1f6; --text-2:#b6bfcc; --text-3:#8692a4;
    --brand:#3987e5; --brand-strong:#6da7ec; --brand-soft:#1a2a40;
    --s-api:#3987e5; --s-iframe:#d95926; --s-mobile:#199e70;
    --s-api-soft:#1a2a40; --s-iframe-soft:#3a2219; --s-mobile-soft:#15302a;
    --warn:#f0b35a; --warn-soft:#3a2c15;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116; --surface:#161a21; --surface-2:#1b2029; --surface-3:#222834;
  --border:#2a313d; --border-strong:#38404e;
  --text:#eef1f6; --text-2:#b6bfcc; --text-3:#8692a4;
  --brand:#3987e5; --brand-strong:#6da7ec; --brand-soft:#1a2a40;
  --s-api:#3987e5; --s-iframe:#d95926; --s-mobile:#199e70;
  --s-api-soft:#1a2a40; --s-iframe-soft:#3a2219; --s-mobile-soft:#15302a;
  --warn:#f0b35a; --warn-soft:#3a2c15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* Header */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#6250d6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:-.5px;flex:none}
.brand-t{font-weight:700;font-size:16px;letter-spacing:-.2px;white-space:nowrap}
.brand-t b{color:var(--brand)}
.brand-s{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sp{flex:1}
.upd{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--s-mobile);box-shadow:0 0 0 3px var(--s-mobile-soft)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px;flex:none}
@media (max-width:720px){.upd,.brand-s{display:none}.btn .lbl{display:none}.btn.primary{width:36px;padding:0;justify-content:center}}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:44px;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:60}
.menu.open .menu-pop{display:block}
.menu-pop button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:13px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop small{display:block;color:var(--text-3);font-size:11.5px}
.menu-sep{height:1px;background:var(--border);margin:6px 4px}

/* Hero */
.hero{padding:28px 0 8px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.6px;font-weight:800}
.hero p{margin:4px 0 0;color:var(--text-2)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0 14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi{padding:18px 18px 16px;position:relative;overflow:hidden}
.kpi.click{cursor:pointer;transition:border-color .15s,transform .15s}
.kpi.click:hover{border-color:var(--brand);transform:translateY(-1px)}
.kpi-h{display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:13px;font-weight:600}
.kpi-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.kpi-ic svg{width:17px;height:17px}
.kpi-v{font-size:34px;font-weight:800;letter-spacing:-1px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12.5px;color:var(--text-3)}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0 8px;background:var(--surface)}
.split i{display:block;height:100%;border-radius:99px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg em{width:9px;height:9px;border-radius:3px;display:inline-block;font-style:normal}
.lg b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

.mx{padding:16px 18px;margin-bottom:18px}
.mx-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mx table{font-size:13.5px}
.mx th{position:static;background:none;cursor:default;font-size:12px;color:var(--text-3);text-align:right;padding:8px 12px}
.mx th:first-child{text-align:left}
.mx td{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;padding:10px 12px}
.mx td:first-child{text-align:left;font-weight:600}
.mx td.z{color:var(--text-3);font-weight:400}
.mx td.go{cursor:pointer;color:var(--brand)}
.mx td.go:hover{background:var(--brand-soft)}
.mx tr.tot td{border-bottom:0;font-weight:800}
.mx tbody tr:hover td{background:none}
.mx td.go:hover{background:var(--brand-soft)}
.mx .tw{overflow-x:auto}

/* Charts */
.charts{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:22px}
#chYear{max-width:760px;margin:0 auto}
.ch{padding:16px 18px 14px;min-width:0}
.ch-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.ch-t{font-weight:700;font-size:14px}
.ch-s{font-size:12px;color:var(--text-3)}
.ch svg{display:block;width:100%;overflow:visible}
.ax{font-size:11px;fill:var(--text-3)}
.vl{font-size:11px;fill:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.gl{stroke:var(--border);stroke-width:1}
.bar{transition:opacity .15s}
.hit{fill:transparent;cursor:pointer}
.hit:hover + .bar, .bar:hover{opacity:.82}
.orgrow{cursor:pointer}
.orgrow:hover .orgname{fill:var(--brand)}
.orgname{font-size:12px;fill:var(--text-2)}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--text);color:var(--surface);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.45;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:260px}
.tip.on{opacity:1}
.tip b{font-weight:700}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.cnt{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface-3);color:var(--text-2);font-variant-numeric:tabular-nums}
.tab.on .cnt{background:var(--brand-soft);color:var(--brand)}
.pane{display:none}
.pane.on{display:block}

/* Toolbar & filters */
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:0 12px 0 38px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;left:12px;top:12px;width:16px;height:16px;color:var(--text-3)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.flbl{font-size:12px;color:var(--text-3);font-weight:600;margin-right:2px}
.fgroup{display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--border-strong)}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.chip .x{font-weight:700}
.chip small{color:var(--text-3);font-variant-numeric:tabular-nums}
.chip.on small{color:inherit}
.sel{height:36px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:0 10px;max-width:260px}
.resinfo{font-size:12.5px;color:var(--text-3);margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:12.5px}

/* Org picker */
.picker{position:relative}
.picker-pop{position:absolute;left:0;top:42px;width:min(380px,86vw);max-height:380px;display:none;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:40}
.picker.open .picker-pop{display:flex}
.picker-pop input{margin:8px;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;background:var(--surface-2);outline:none}
.picker-list{overflow:auto;padding:0 6px 6px}
.picker-list label{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.picker-list label:hover{background:var(--surface-2)}
.picker-list label span{flex:1}
.picker-list small{color:var(--text-3);font-variant-numeric:tabular-nums}

/* Org cards */
.orgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.orgs{grid-template-columns:1fr}}
.org-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.org-ic{width:38px;height:38px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;font-size:18px;flex:none}
.org-n{font-weight:700;font-size:14px;line-height:1.3}
.org-m{font-size:12px;color:var(--text-3);margin-top:2px}
.org-c{margin-left:auto;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;color:var(--text-3);transition:transform .2s;flex:none}
.org.open .chev{transform:rotate(180deg)}
.org-split{display:flex;height:4px;gap:2px;margin:0 16px 12px;border-radius:99px;overflow:hidden}
.org-split i{display:block;border-radius:99px}
.org-b{display:none;border-top:1px solid var(--border);max-height:420px;overflow:auto}
.org.open .org-b{display:block}
.sv{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px}
.sv:last-child{border-bottom:0}
.sv-n{flex:1;min-width:0}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;letter-spacing:.1px}
.t-api{background:var(--s-api-soft);color:var(--s-api)}
.t-ifr{background:var(--s-iframe-soft);color:var(--s-iframe)}
.t-mob{background:var(--s-mobile-soft);color:var(--s-mobile)}
.t-web{background:var(--surface-3);color:var(--text-2)}
.t-pdf{background:var(--s-api-soft);color:var(--s-api)}
.t-doc{background:var(--s-mobile-soft);color:var(--s-mobile)}
.t-pnd{background:var(--warn-soft);color:var(--warn)}
.t-no{background:var(--surface-3);color:var(--text-3)}
.yr{font-size:12px;color:var(--text-3);white-space:nowrap;min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}

/* Table */
.tbl-w{overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12px;color:var(--text-2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th:hover{color:var(--text)}
th .ar{color:var(--brand);margin-left:4px}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover td{background:var(--surface-2)}
td.num{color:var(--text-3);font-variant-numeric:tabular-nums;width:44px}
td.muted{color:var(--text-2)}

/* Data groups */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.dgrid{grid-template-columns:1fr}}
.dcol-h{font-weight:700;font-size:13px;color:var(--text-2);margin:2px 2px 10px;display:flex;gap:8px;align-items:center}
.dg{margin-bottom:12px}
.dg-h{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--border)}
.di{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);font-size:13px}
.di:last-child{border-bottom:0}
.di-q{font-size:12px;color:var(--text-3);max-width:40%;text-align:right}


.empty{padding:40px;text-align:center;color:var(--text-3)}
.foot{padding:28px 0 40px;color:var(--text-3);font-size:12px;text-align:center}

/* Loader */
.lov{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lov.hide{display:none}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brand);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{max-width:400px;text-align:center;padding:24px}
.err h3{margin:0 0 6px;color:#e34948}
.err p{margin:0 0 14px;color:var(--text-2)}
</style>
</head>
<body>
<div class="lov" id="lov"><div class="spin"></div><div style="color:var(--text-2)">Məlumatlar yüklənir…</div></div>
<div class="tip" id="tip"></div>

<header class="hdr"><div class="wrap">
  <a class="brand" href="#">
    <div class="mark">mg</div>
    <div style="min-width:0"><div class="brand-t">my<b>gov</b> · İnteqrasiya paneli</div><div class="brand-s">Rəqəmsal xidmətlər və məlumatlar</div></div>
  </a>
  <div class="hdr-sp"></div>
  <div class="upd"><span class="dot"></span><span id="upd">—</span></div>
  <button class="btn icon" id="themeBtn" title="Tema" aria-label="Temanı dəyiş">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <div class="menu" id="expMenu">
    <button class="btn primary" id="expBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span class="lbl">Excel-ə yüklə</span></button>
    <div class="menu-pop">
      <button data-exp="view"><div>Görünən nəticələr<small>Aktiv bölmə, seçilmiş filtrlərlə</small></div></button>
      <div class="menu-sep"></div>
      <button data-exp="svc"><div>Bütün xidmətlər</div></button>
      <button data-exp="data"><div>Bütün məlumatlar</div></button>
      <button data-exp="all"><div>Hamısı (bir faylda)</div></button>
    </div>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>İnteqrasiya olunmuş xidmət və məlumatlar</h1>
    <p id="heroSub">—</p>
  </section>

  <section class="kpis" id="kpis"></section>
  <section class="card mx" id="mini"></section>

  <section class="charts">
    <div class="card ch"><div class="ch-h"><div><div class="ch-t">İllər üzrə inteqrasiya</div><div class="ch-s">Hər il inteqrasiya olunan xidmət və məlumat sayı</div></div><div class="lg" id="lgYear"></div></div><div id="chYear"></div></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="svc">Xidmətlər <span class="cnt" id="cSvc">0</span></button>
    <button class="tab" data-tab="data">Məlumat və sənədlər <span class="cnt" id="cData">0</span></button>
  </nav>

  <!-- Services -->
  <section class="pane on" id="p-svc">
    <div class="bar-row">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sQ" placeholder="Xidmət və ya qurum axtar…" autocomplete="off"></label>
      <div class="picker" id="orgPicker">
        <button class="btn" id="orgBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg><span id="orgBtnT">Bütün qurumlar</span></button>
        <div class="picker-pop"><input id="orgQ" placeholder="Qurum axtar…"><div class="picker-list" id="orgList"></div></div>
      </div>
      <div class="seg" id="svcView"><button class="on" data-v="cards">Qruplar</button><button data-v="table">Cədvəl</button></div>
    </div>
    <div class="bar-row">
      <span class="fgroup"><span class="flbl">Forma</span><span class="seg" id="fForm"><button class="on" data-v="">Hamısı</button><button data-v="API">API</button><button data-v="Iframe">Iframe</button></span></span>
      <span class="fgroup"><span class="flbl">Platforma</span><span class="seg" id="fPlat"><button class="on" data-v="">Hamısı</button><button data-v="mob">VEB + Mobile</button><button data-v="web">Yalnız VEB</button><button data-v="mobonly">Yalnız Mobile</button></span></span>
      <span class="fgroup"><span class="flbl">İl</span><span class="seg" id="fYear"></span></span>
    </div>
    <div class="chips" id="orgChips"></div>

<script>
/* ===================== Config ===================== */
var CONFIG = {
  sheetId: "1XPWJ-9uN4awNtiAMKGNv9aM-ya7-Q-7-",
  sheets: { svc: "Xidmətlər", data: "Məlumat və sənədlər" },
  headerRow: 3,
  localFile: "data.json"
};
var MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
var MON_S = ["Yan","Fev","Mar","Apr","May","İyn","İyl","Avq","Sen","Okt","Noy","Dek"];

/* ===================== State ===================== */
var S = [], D = [];
var SF = { q:"", form:"", plat:"", year:"", orgs:[], view:"cards", sort:{k:"no",d:1}, open:{} };
var DFL = { q:"", veb:[], mob:"", org:"", pdf:"", year:"", view:"groups", sort:{k:"no",d:1} };
var activeTab = "svc";

/* ===================== Utils ===================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return s == null ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function norm(s){ return String(s||"").toLocaleLowerCase("az").replace(/\s+/g," ").trim(); }
function hl(text, q){
  var t = esc(text); if (!q) return t;
  var i = norm(text).indexOf(q); if (i < 0) return t;
  var raw = String(text);
  return esc(raw.slice(0,i)) + "<mark>" + esc(raw.slice(i,i+q.length)) + "</mark>" + esc(raw.slice(i+q.length));
}
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function monthIdx(m){
  if (m == null || m === "") return -1;
  if (typeof m === "number") return m >= 1 && m <= 12 ? m-1 : -1;
  var n = norm(m);
  for (var i=0;i<12;i++){ if (norm(MONTHS[i]) === n || n.indexOf(norm(MONTHS[i]).slice(0,3)) === 0) return i; }
  var en = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  for (var j=0;j<12;j++){ if (n.indexOf(en[j]) === 0) return j; }
  return -1;
}
function asDate(v){
  if (v instanceof Date) return v;
  if (typeof v === "number" && v > 3000) return new Date(Math.round((v - 25569) * 86400000));  // Excel serial
  if (typeof v === "string" && /^\d{4}-\d\d-\d\d/.test(v)) return new Date(v.slice(0,10) + "T00:00:00");
  return null;
}
function yearOf(v){
  if (v == null || v === "") return "";
  var dt = asDate(v); if (dt) return String(dt.getFullYear());
  if (typeof v === "number") return String(Math.round(v));
  var m = String(v).match(/(20\d\d)/); return m ? m[1] : "";
}
/* month from a dedicated month cell, else from a date/text year cell ("Aprel 2026") */
function monthOf(monCell, yearCell){
  var i = monthIdx(monCell); if (i >= 0) return i;
  var dt = asDate(yearCell); if (dt) return dt.getMonth();
  if (typeof yearCell === "string") return monthIdx(yearCell.replace(/\d+/g,"").trim());
  return -1;
}
function when(y, m){ var i = monthIdx(m); return (i >= 0 ? MONTHS[i] + " " : "") + (y || ""); }
function isMob(p){ return /mobile/i.test(p||""); }
function isWebOnly(p){ return (p||"").trim().toUpperCase() === "VEB"; }
function isMobOnly(p){ return /^mobile$/i.test((p||"").trim()); }
function fmt(n){ return Number(n).toLocaleString("az"); }

/* ===================== Loading ===================== */
function gvizUrl(sheet){
  return "https://docs.google.com/spreadsheets/d/" + CONFIG.sheetId + "/gviz/tq?tqx=out:json&headers=1&sheet=" +
    encodeURIComponent(sheet) + "&range=" + encodeURIComponent("A" + CONFIG.headerRow + ":Z2000");
}
function fetchGviz(sheet){
  return fetch(gvizUrl(sheet), {cache:"no-store"}).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function(t){
    var j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1));
    if (j.status === "error") throw new Error((j.errors && j.errors[0] && j.errors[0].detailed_message) || "gviz xətası");
    var cols = j.table.cols.map(function(c){ return c.label || ""; });
    var rows = j.table.rows.map(function(r){
      return (r.c || []).map(function(c){
        if (!c) return null;
        if (typeof c.v === "string" && c.v.indexOf("Date(") === 0) {
          var p = c.v.slice(5, -1).split(",").map(Number);
          return new Date(p[0], p[1] || 0, p[2] || 1);
        }
        return c.v;
      });
    });
    return {cols:cols, rows:rows};
  });
}
function colIdx(cols, tests){
  var n = cols.map(norm);
  for (var t=0;t<tests.length;t++){
    for (var i=0;i<n.length;i++){ if (tests[t](n[i])) return i; }
  }
  return -1;
}
function eq(s){ return function(x){ return x === s; }; }
function has(s){ return function(x){ return x.indexOf(s) !== -1; }; }
function cell(r,i){ return i >= 0 && r[i] != null ? r[i] : ""; }
function txt(r,i){ var v = cell(r,i); return v === "" ? "" : String(v).replace(/\s+/g," ").trim(); }

function parseSvc(t){
  var c = t.cols;
  var iOrg = colIdx(c,[eq("qurum")]), iName = colIdx(c,[has("xidmətin adı"),has("adı")]),
      iForm = colIdx(c,[has("forma")]), iPlat = colIdx(c,[has("platforma")]),
      iYear = colIdx(c,[has("ili"),eq("il")]), iMon = colIdx(c,[has("ayı"),eq("ay")]);
  var out = [], last = "";
  t.rows.forEach(function(r){
    var org = txt(r,iOrg); if (org) last = org; else org = last;
    var name = txt(r,iName); if (!name || !org) return;
    out.push({ no: out.length + 1, org: org, name: name,
      form: /api/i.test(txt(r,iForm)) ? "API" : (txt(r,iForm) ? "Iframe" : ""),
      plat: txt(r,iPlat), year: yearOf(cell(r,iYear)), mon: monthOf(iMon >= 0 ? cell(r,iMon) : "", cell(r,iYear)) });
  });
  return out;
}
function parseData(t){
  var c = t.cols;
  var iName = colIdx(c,[has("adı")]), iVeb = colIdx(c,[eq("veb")]), iMob = colIdx(c,[eq("mobile")]),
      iOrg = colIdx(c,[eq("qurum")]), iYear = colIdx(c,[eq("il"),has("ili")]), iMon = colIdx(c,[eq("ay"),has("ayı")]),
      iPdf = colIdx(c,[has("pdf")]);
  var out = [];
  t.rows.forEach(function(r){
    var name = txt(r,iName); if (!name) return;
    out.push({ no: out.length + 1, name: name, veb: txt(r,iVeb), mob: txt(r,iMob), org: txt(r,iOrg),
      year: yearOf(cell(r,iYear)), mon: monthOf(iMon >= 0 ? cell(r,iMon) : "", cell(r,iYear)), pdf: txt(r,iPdf) });
  });
  return out;
}

function loadAll(){
  var forceLocal = /[?&]src=local/.test(location.search);
  var fromSheets = Promise.all([fetchGviz(CONFIG.sheets.svc), fetchGviz(CONFIG.sheets.data)])
    .then(function(a){ return {svc:a[0], data:a[1], src:"Google Drive (canlı)"}; });
  var fromLocal = function(){
    return fetch(CONFIG.localFile, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("data.json tapılmadı"); return r.json(); })
      .then(function(j){ return {svc:j[CONFIG.sheets.svc], data:j[CONFIG.sheets.data], src:"lokal nüsxə (data.json)"}; });
  };
  var p = forceLocal ? fromLocal() : fromSheets.catch(function(e){ console.warn("Sheets:", e); return fromLocal(); });
  p.then(function(res){
    S = parseSvc(res.svc); D = parseData(res.data);
    if (!S.length) throw new Error("Xidmətlər vərəqi boş gəldi");
    $("srcInfo").textContent = res.src;
    var now = new Date(), z = function(n){ return (n<10?"0":"") + n; };
    $("upd").textContent = "Yeniləndi: " + z(now.getDate()) + "." + z(now.getMonth()+1) + "." + now.getFullYear() + " " + z(now.getHours()) + ":" + z(now.getMinutes());
    init();
    $("lov").classList.add("hide");
  }).catch(function(e){
    $("lov").innerHTML = '<div class="err card"><h3>Yükləmə xətası</h3><p>' + esc(e.message || e) + '</p><button class="btn primary" onclick="location.reload()">Yenidən cəhd et</button></div>';
  });
}

/* ===================== Icons ===================== */
var ICONS = [["əmək","👷"],["rəqəmsal inkişaf","📡"],["seçki","🗳️"],["gömrük","🛃"],["daxili","🛡️"],["elm","🎓"],["ədliyyə","⚖️"],["səhiyyə","🏥"],["statistika","📊"],["iqtisadiyyat","💼"],["arxiv","📚"],["ekologiya","🌿"],["əqli","💡"],["müdafiə","🛠️"],["energetika","⚡"],["miqrasiya","🛂"],["vətəndaşlara xidmət","🤝"],["xarici","🌐"],["səfərbərlik","🎖️"],["azərişıq","💡"],["ombudsman","👤"],["imtahan","📝"],["mənzil","🏗️"],["ipoteka","🏠"],["qida","🍽️"],["aviasiya","✈️"],["icra","🏛️"],["mərkəzi bank","🏦"],["su ","💧"],["azəriqaz","🔥"],["təbib","🩺"],["ayna","🚦"],["digər","📦"]];
function icon(n){ n = norm(n) + " "; for (var i=0;i<ICONS.length;i++){ if (n.indexOf(ICONS[i][0]) !== -1) return ICONS[i][1]; } return "🏛️"; }

/* ===================== Tooltip ===================== */
var tipEl;
function tip(e, html){ tipEl.innerHTML = html; tipEl.classList.add("on"); moveTip(e); }
function moveTip(e){
  var x = e.clientX + 14, y = e.clientY + 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
function untip(){ tipEl.classList.remove("on"); }
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(function(n){
    n.addEventListener("mouseenter", function(e){ tip(e, n.getAttribute("data-tip")); });
    n.addEventListener("mousemove", moveTip);
    n.addEventListener("mouseleave", untip);
  });
}

/* ===================== KPIs ===================== */
function renderKPIs(){
  var api=0, ifr=0, web=0, both=0, vapi=0, mob=0, mobonly=0;
  S.forEach(function(s){
    if (s.form === "API") api++; else ifr++;
    if (isWebOnly(s.plat)) web++;
    if (isMob(s.plat)) { mob++; if (isMobOnly(s.plat)) mobonly++; else both++; }
    if (isWebOnly(s.plat) && s.form === "API") vapi++;
  });
  var orgs = {}; S.forEach(function(s){ orgs[s.org] = 1; });
  var nOrg = Object.keys(orgs).length;
  var years = S.map(function(s){ return +s.year || 0; }).concat(D.map(function(d){ return +d.year || 0; }));
  var ly = Math.max.apply(null, years);
  var svcLY = S.filter(function(s){ return +s.year === ly; }).length, dataLY = D.filter(function(d){ return +d.year === ly; }).length;
  var pct = function(a,b){ return b ? Math.round(a/b*100) : 0; };

  $("heroSub").textContent = nOrg + " dövlət qurumu · " + fmt(S.length) + " xidmət · " + fmt(D.length) + " məlumat və sənəd. " + ly + "-cü ildə " + (svcLY + dataLY) + " yeni inteqrasiya.";

  var ic = {
    svc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    data:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
    org:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>',
    mob:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>'
  };
  var k = "";
  k += '<div class="card kpi click" data-go="svc"><div class="kpi-h">Xidmətlər<span class="kpi-ic">'+ic.svc+'</span></div><div class="kpi-v">'+fmt(S.length)+'</div>'+
       '<div class="split"><i style="width:'+pct(api,S.length)+'%;background:var(--s-api)"></i><i style="width:'+pct(ifr,S.length)+'%;background:var(--s-iframe)"></i></div>'+
       '<div class="lg"><span><em style="background:var(--s-api)"></em>API <b>'+api+'</b></span><span><em style="background:var(--s-iframe)"></em>Iframe <b>'+ifr+'</b></span></div></div>';
  k += '<div class="card kpi click" data-go="data"><div class="kpi-h">Məlumat və sənədlər<span class="kpi-ic" style="background:var(--s-iframe-soft);color:var(--s-iframe)">'+ic.data+'</span></div><div class="kpi-v">'+fmt(D.length)+'</div><div class="kpi-s">"Məlumatlarım" bölməsində inteqrasiya olunmuş məlumat və sənəd</div></div>';
  k += '<div class="card kpi click" data-go="org"><div class="kpi-h">Qurumlar<span class="kpi-ic" style="background:var(--surface-3);color:var(--text-2)">'+ic.org+'</span></div><div class="kpi-v">'+nOrg+'</div><div class="kpi-s">Xidməti inteqrasiya olunmuş dövlət qurumu və təşkilat</div></div>';
  k += '<div class="card kpi click" data-go="mob"><div class="kpi-h">Mobil tətbiqdə<span class="kpi-ic" style="background:var(--s-mobile-soft);color:var(--s-mobile)">'+ic.mob+'</span></div><div class="kpi-v">'+mob+'</div>'+
       '<div class="split"><i style="width:'+pct(mob,S.length)+'%;background:var(--s-mobile)"></i><i style="width:'+(100-pct(mob,S.length))+'%;background:var(--surface-3)"></i></div>'+
       '<div class="kpi-s">Xidmətlərin <b style="color:var(--text)">'+pct(mob,S.length)+'%</b>-i mobil tətbiqdə də var</div></div>';
  $("kpis").innerHTML = k;

  // forma × platforma matrix
  var P = [["mob","VEB + Mobile"],["web","Yalnız VEB"],["mobonly","Yalnız Mobile"]];
  var inP = function(s, p){ return p === "mob" ? (isMob(s.plat) && !isMobOnly(s.plat)) : p === "web" ? isWebOnly(s.plat) : isMobOnly(s.plat); };
  var cellC = function(f, p){ var n = S.filter(function(s){ return (!f || s.form === f) && (!p || inP(s,p)); }).length;
    return '<td class="'+(n ? "go" : "z")+'"'+(n ? ' data-f="'+f+'" data-p="'+p+'" title="Xidmətləri göstər"' : "")+'>'+fmt(n)+'</td>'; };
  var rowH = function(f, label){ return '<tr'+(f === "" ? ' class="tot"' : "")+'><td>'+label+'</td>'+P.map(function(p){ return cellC(f, p[0]); }).join("")+cellC(f,"")+'</tr>'; };
  $("mini").innerHTML = '<div class="mx-h"><div class="ch-t">Forma və platforma üzrə bölgü</div><div class="ch-s">Rəqəmə klikləyin — həmin xidmətlər açılsın</div></div>' +
    '<div class="tw"><table><thead><tr><th>İnteqrasiya forması</th>'+P.map(function(p){ return '<th>'+p[1]+'</th>'; }).join("")+'<th>Cəmi</th></tr></thead><tbody>' +
    rowH("API","API") + rowH("Iframe","Iframe") + rowH("","Cəmi") + '</tbody></table></div>';
  $("mini").querySelectorAll("td.go").forEach(function(td){

/* ===================== Charts ===================== */
function niceMax(v){ if (v <= 5) return 5; var p = Math.pow(10, Math.floor(Math.log10(v))); var f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function groupedBars(el, cats, series, opts){
  var W = opts.w || 520, Hh = opts.h || 220, pl = 34, pr = 6, pt = 18, pb = 26;
  var max = niceMax(Math.max.apply(null, series.reduce(function(a,s){ return a.concat(s.vals); }, [1])));
  var iw = W - pl - pr, ih = Hh - pt - pb, gw = iw / cats.length, bw = Math.min(opts.bw || 22, (gw - 10) / series.length - 2);
  var g = '<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+esc(opts.label)+'">';
  for (var t=0;t<=4;t++){ var y = pt + ih - ih*t/4; g += '<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+Math.round(max*t/4)+'</text>'; }
  cats.forEach(function(c, i){
    var gx = pl + gw*i + (gw - (bw+2)*series.length + 2)/2;
    series.forEach(function(s, j){
      var v = s.vals[i], h = v ? Math.max(2, ih * v / max) : 0, x = gx + j*(bw+2), y = pt + ih - h;
      var tipH = '<b>'+esc(opts.tipCat ? opts.tipCat(c) : c)+'</b><br>'+esc(s.name)+': <b>'+v+'</b>';
      if (h) g += '<path class="bar" fill="'+s.color+'" d="M'+x+','+(pt+ih)+'V'+(y+4)+'q0,-4 4,-4h'+(bw-8)+'q4,0 4,4V'+(pt+ih)+'z"/>';
      g += '<rect class="hit" x="'+(x-1)+'" y="'+pt+'" width="'+(bw+2)+'" height="'+ih+'" data-tip="'+esc(tipH)+'"/>';
      if (v && opts.labels) g += '<text class="vl" x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle">'+v+'</text>';
    });
    g += '<text class="ax" x="'+(pl + gw*i + gw/2)+'" y="'+(Hh-8)+'" text-anchor="middle">'+esc(c)+'</text>';
  });
  g += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ih)+'" y2="'+(pt+ih)+'" stroke="var(--border-strong)"/></svg>';
  el.innerHTML = g; bindTips(el);
}
function legend(el, items){ el.innerHTML = items.map(function(i){ return '<span><em style="background:'+i[1]+'"></em>'+esc(i[0])+(i[2] != null ? ' <b>'+i[2]+'</b>' : '')+'</span>'; }).join(""); }

function renderCharts(){
  var ys = {};
  S.forEach(function(s){ if (s.year) ys[s.year] = 1; }); D.forEach(function(d){ if (d.year) ys[d.year] = 1; });
  var years = Object.keys(ys).sort();
  var cnt = function(arr, y){ return arr.filter(function(x){ return x.year === y; }).length; };
  var sv = years.map(function(y){ return cnt(S,y); }), dv = years.map(function(y){ return cnt(D,y); });
  groupedBars($("chYear"), years, [{name:"Xidmət", color:"var(--s-api)", vals:sv},{name:"Məlumat", color:"var(--s-iframe)", vals:dv}], {label:"İllər üzrə", labels:true, bw:46, w:640, h:240});
  legend($("lgYear"), [["Xidmət","var(--s-api)"],["Məlumat","var(--s-iframe)"]]);

}

/* ===================== Segmented helper ===================== */
function seg(id, onChange){
  $(id).addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    segSet(id, b.getAttribute("data-v")); onChange(b.getAttribute("data-v"));
  });
}
function segSet(id, v){ $(id).querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v") === v); }); }
function fillSeg(id, values, labels){ $(id).innerHTML = '<button class="on" data-v="">Hamısı</button>' + values.map(function(v,i){ return '<button data-v="'+esc(v)+'">'+esc(labels ? labels[i] : v)+'</button>'; }).join(""); }

/* ===================== Services ===================== */
function svcFiltered(){
  var q = SF.q;
  return S.filter(function(s){
    if (SF.form && s.form !== SF.form) return false;
    if (SF.plat === "mob" && !(isMob(s.plat) && !isMobOnly(s.plat))) return false;
    if (SF.plat === "web" && !isWebOnly(s.plat)) return false;
    if (SF.plat === "mobonly" && !isMobOnly(s.plat)) return false;
    if (SF.year && s.year !== SF.year) return false;
    if (SF.orgs.length && SF.orgs.indexOf(s.org) === -1) return false;
    if (q && norm(s.name + " " + s.org).indexOf(q) === -1) return false;
    return true;
  });
}
function tagsFor(s){
  var t = s.form === "API" ? '<span class="tag t-api">API</span>' : s.form ? '<span class="tag t-ifr">Iframe</span>' : "";
  if (isMobOnly(s.plat)) t += ' <span class="tag t-mob">Mobile</span>';
  else if (isMob(s.plat)) t += ' <span class="tag t-web">Web</span> <span class="tag t-mob">Mobile</span>';
  else if (s.plat) t += ' <span class="tag t-web">Web</span>';
  return t;
}
function renderSvc(){
  var list = svcFiltered(), q = SF.q, out = $("svcOut");
  var orgCount = {}; list.forEach(function(s){ orgCount[s.org] = 1; });
  $("svcInfo").textContent = fmt(list.length) + " xidmət · " + Object.keys(orgCount).length + " qurum göstərilir";
  if (!list.length) { out.innerHTML = '<div class="card empty">Seçilmiş filtrlərə uyğun xidmət tapılmadı.</div>'; return; }
  if (SF.view === "table") {
    var k = SF.sort.k, d = SF.sort.d;
    list = list.slice().sort(function(a,b){
      var x = k === "when" ? (a.year||"0") + String(a.mon+10).padStart(2,"0") : a[k], y = k === "when" ? (b.year||"0") + String(b.mon+10).padStart(2,"0") : b[k];
      return (x > y ? 1 : x < y ? -1 : 0) * d;
    });
    var th = function(key, label){ return '<th data-k="'+key+'">'+label+(k === key ? '<span class="ar">'+(d>0?"↑":"↓")+'</span>' : "")+'</th>'; };
    out.innerHTML = '<div class="card tbl-w"><table><thead><tr>'+th("no","#")+th("name","Xidmətin adı")+th("org","Qurum")+th("form","Forma")+th("plat","Platforma")+th("when","Tarix")+'</tr></thead><tbody>' +
      list.map(function(s){ return '<tr><td class="num">'+s.no+'</td><td>'+hl(s.name,q)+'</td><td class="muted">'+hl(s.org,q)+'</td><td>'+(s.form==="API"?'<span class="tag t-api">API</span>':'<span class="tag t-ifr">Iframe</span>')+'</td><td class="muted">'+esc(s.plat)+'</td><td class="muted" style="white-space:nowrap">'+esc(when(s.year, s.mon))+'</td></tr>'; }).join("") +
      '</tbody></table></div>';
    out.querySelectorAll("th").forEach(function(h){ h.addEventListener("click", function(){ var kk = h.getAttribute("data-k"); SF.sort = {k:kk, d: SF.sort.k === kk ? -SF.sort.d : 1}; renderSvc(); }); });
    return;
  }
  var groups = {}, order = [];
  list.forEach(function(s){ if (!groups[s.org]) { groups[s.org] = []; order.push(s.org); } groups[s.org].push(s); });
  var autoOpen = q || SF.orgs.length || order.length <= 2;
  out.innerHTML = '<div class="orgs">' + order.map(function(o){
    var g = groups[o], api = g.filter(function(s){ return s.form === "API"; }).length, ifr = g.length - api, total = S.filter(function(s){ return s.org === o; }).length;
    var open = autoOpen || SF.open[o];
    return '<div class="card org'+(open?" open":"")+'" data-org="'+esc(o)+'">' +
      '<div class="org-h"><div class="org-ic">'+icon(o)+'</div><div style="min-width:0"><div class="org-n">'+hl(o,q)+'</div><div class="org-m">'+api+' API · '+ifr+' Iframe'+(g.length !== total ? ' · cəmi '+total : '')+'</div></div><div class="org-c">'+g.length+'</div>' +
      '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>' +
      '<div class="org-split"><i style="flex:'+api+';background:var(--s-api)"></i><i style="flex:'+ifr+';background:var(--s-iframe)"></i></div>' +
      '<div class="org-b">' + g.map(function(s){ return '<div class="sv"><span class="sv-n">'+hl(s.name,q)+'</span>'+tagsFor(s)+'<span class="yr">'+esc(when(s.year,s.mon))+'</span></div>'; }).join("") + '</div></div>';
  }).join("") + '</div>';
  out.querySelectorAll(".org-h").forEach(function(h){
    h.addEventListener("click", function(){ var c = h.parentElement, o = c.getAttribute("data-org"); c.classList.toggle("open"); SF.open[o] = c.classList.contains("open"); });
  });
}
function renderOrgPicker(){
  var by = {}; S.forEach(function(s){ by[s.org] = (by[s.org]||0) + 1; });
  var q = norm($("orgQ").value);
  var names = Object.keys(by).sort(function(a,b){ return by[b] - by[a]; });
  $("orgList").innerHTML = names.filter(function(n){ return !q || norm(n).indexOf(q) !== -1; }).map(function(n){
    return '<label><input type="checkbox" value="'+esc(n)+'"'+(SF.orgs.indexOf(n) !== -1 ? " checked" : "")+'><span>'+esc(n)+'</span><small>'+by[n]+'</small></label>';
  }).join("") || '<div class="empty" style="padding:16px">Tapılmadı</div>';
  $("orgBtnT").textContent = SF.orgs.length ? SF.orgs.length + " qurum seçilib" : "Bütün qurumlar";
  $("orgChips").innerHTML = SF.orgs.map(function(o){ return '<span class="chip on" data-org="'+esc(o)+'">'+esc(o)+' <span class="x">×</span></span>'; }).join("");
  $("orgChips").style.marginBottom = SF.orgs.length ? "6px" : "0";
}
function bindSvc(){
  $("sQ").addEventListener("input", function(){ SF.q = norm(this.value); renderSvc(); });
  seg("fForm", function(v){ SF.form = v; renderSvc(); });
  seg("fPlat", function(v){ SF.plat = v; renderSvc(); });
  var ys = {}; S.forEach(function(s){ if (s.year) ys[s.year] = 1; });
  fillSeg("fYear", Object.keys(ys).sort());
  seg("fYear", function(v){ SF.year = v; renderSvc(); });
  seg("svcView", function(v){ SF.view = v; renderSvc(); });
  $("orgBtn").addEventListener("click", function(e){ e.stopPropagation(); $("orgPicker").classList.toggle("open"); if ($("orgPicker").classList.contains("open")) $("orgQ").focus(); });
  $("orgPicker").addEventListener("click", function(e){ e.stopPropagation(); });
  $("orgQ").addEventListener("input", renderOrgPicker);
  $("orgList").addEventListener("change", function(e){
    var v = e.target.value, i = SF.orgs.indexOf(v);
    if (e.target.checked && i === -1) SF.orgs.push(v); else if (!e.target.checked && i !== -1) SF.orgs.splice(i,1);
    renderOrgPicker(); renderSvc();
  });
  $("orgChips").addEventListener("click", function(e){ var c = e.target.closest(".chip"); if (!c) return; SF.orgs.splice(SF.orgs.indexOf(c.getAttribute("data-org")),1); renderOrgPicker(); renderSvc(); });
  $("expandAll").addEventListener("click", function(){
    var cards = document.querySelectorAll("#svcOut .org"), anyClosed = Array.prototype.some.call(cards, function(c){ return !c.classList.contains("open"); });
    cards.forEach(function(c){ c.classList.toggle("open", anyClosed); SF.open[c.getAttribute("data-org")] = anyClosed; });
    this.textContent = anyClosed ? "Hamısını bağla" : "Hamısını aç";
  });
  $("svcReset").addEventListener("click", function(){
    SF.q = ""; SF.form = ""; SF.plat = ""; SF.year = ""; SF.orgs = []; $("sQ").value = "";
    segSet("fForm",""); segSet("fPlat",""); segSet("fYear",""); renderOrgPicker(); renderSvc();
  });
}

/* ===================== Data ===================== */
function splitVeb(v){ return v ? v.split(/\s*,\s*/).filter(Boolean) : ["Kateqoriyasız"]; }
function splitMob(v){ return v ? v.split(/\s+-\s+/).filter(Boolean) : ["Kateqoriyasız"]; }
function dataFiltered(){
  var q = DFL.q;
  return D.filter(function(d){
    if (DFL.veb.length && !splitVeb(d.veb).some(function(v){ return DFL.veb.indexOf(v) !== -1; })) return false;
    if (DFL.mob && splitMob(d.mob).indexOf(DFL.mob) === -1) return false;
    if (DFL.org && d.org !== DFL.org) return false;
    if (DFL.year && d.year !== DFL.year) return false;
    if (q && norm(d.name + " " + d.veb + " " + d.mob + " " + d.org).indexOf(q) === -1) return false;
    return true;
  });
}
function renderData(){
  var list = dataFiltered(), q = DFL.q, out = $("dataOut");
  $("dataInfo").textContent = list.length + " məlumat göstərilir";
  // veb chips with counts
  var vc = {}; D.forEach(function(d){ splitVeb(d.veb).forEach(function(v){ vc[v] = (vc[v]||0) + 1; }); });
  $("dVeb").innerHTML = '<span class="chip'+(DFL.veb.length?"":" on")+'" data-v="">Bütün kateqoriyalar</span>' + Object.keys(vc).sort().map(function(v){
    return '<span class="chip'+(DFL.veb.indexOf(v) !== -1 ? " on" : "")+'" data-v="'+esc(v)+'">'+esc(v.replace(" məlumatlarım",""))+' <small>'+vc[v]+'</small></span>';
  }).join("");
  $("dVeb").style.marginBottom = "4px";
  if (!list.length) { out.innerHTML = '<div class="card empty">Seçilmiş filtrlərə uyğun məlumat tapılmadı.</div>'; return; }
  if (DFL.view === "table") {
    var k = DFL.sort.k, dd = DFL.sort.d;
    list = list.slice().sort(function(a,b){ var x = a[k], y = b[k]; return (x > y ? 1 : x < y ? -1 : 0) * dd; });
    var th = function(key, label){ return '<th data-k="'+key+'">'+label+(k === key ? '<span class="ar">'+(dd>0?"↑":"↓")+'</span>' : "")+'</th>'; };
    out.innerHTML = '<div class="card tbl-w"><table><thead><tr>'+th("no","#")+th("name","Məlumat və ya sənədin adı")+th("veb","VEB kateqoriya")+th("mob","Mobile kateqoriya")+th("org","Qurum")+th("year","Tarix")+'</tr></thead><tbody>' +
      list.map(function(d){ return '<tr><td class="num">'+d.no+'</td><td>'+hl(d.name,q)+'</td><td class="muted">'+(d.veb ? hl(d.veb,q) : '<span class="tag t-pnd">Saytda yoxdur</span>')+'</td><td class="muted">'+hl(d.mob,q)+'</td><td class="muted">'+hl(d.org,q)+'</td><td class="muted" style="white-space:nowrap">'+esc(when(d.year,d.mon))+'</td></tr>'; }).join("") +
      '</tbody></table></div>';
    out.querySelectorAll("th").forEach(function(h){ h.addEventListener("click", function(){ var kk = h.getAttribute("data-k"); DFL.sort = {k:kk, d: DFL.sort.k === kk ? -DFL.sort.d : 1}; renderData(); }); });
    return;
  }
  var col = function(title, splitter, field){
    var g = {}; list.forEach(function(d){ splitter(d[field]).forEach(function(c){ (g[c] = g[c] || []).push(d); }); });
    var keys = Object.keys(g).sort(function(a,b){ return g[b].length - g[a].length; });
    return '<div><div class="dcol-h">'+title+' <span class="cnt">'+keys.length+'</span></div>' + keys.map(function(c){
      return '<div class="card dg"><div class="dg-h"><span>'+esc(c)+'</span><span class="cnt">'+g[c].length+'</span></div>' +
        g[c].map(function(d){ return '<div class="di"><span class="sv-n">'+hl(d.name,q)+'</span><span class="di-q">'+esc(d.org)+'</span></div>'; }).join("") + '</div>';
    }).join("") + '</div>';
  };
  out.innerHTML = '<div class="dgrid">' + col("VEB kateqoriyaları", splitVeb, "veb") + col("Mobile kateqoriyaları", splitMob, "mob") + '</div>';
}
function bindData(){
  $("dQ").addEventListener("input", function(){ DFL.q = norm(this.value); renderData(); });
  var mc = {}; D.forEach(function(d){ splitMob(d.mob).forEach(function(m){ mc[m] = (mc[m]||0) + 1; }); });
  $("dMob").innerHTML = '<option value="">Mobile: bütün kateqoriyalar</option>' + Object.keys(mc).sort().map(function(m){ return '<option value="'+esc(m)+'">'+esc(m)+' ('+mc[m]+')</option>'; }).join("");
  $("dMob").addEventListener("change", function(){ DFL.mob = this.value; renderData(); });
  var oc = {}; D.forEach(function(d){ if (d.org) oc[d.org] = (oc[d.org]||0) + 1; });
  $("dOrg").innerHTML = '<option value="">Qurum: hamısı</option>' + Object.keys(oc).sort().map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+' ('+oc[o]+')</option>'; }).join("");
  $("dOrg").addEventListener("change", function(){ DFL.org = this.value; renderData(); });
  var ys = {}; D.forEach(function(d){ if (d.year) ys[d.year] = 1; });
  fillSeg("dYear", Object.keys(ys).sort());
  seg("dYear", function(v){ DFL.year = v; renderData(); });
  seg("dataView", function(v){ DFL.view = v; renderData(); });
  $("dVeb").addEventListener("click", function(e){
    var c = e.target.closest(".chip"); if (!c) return; var v = c.getAttribute("data-v");
    if (!v) DFL.veb = []; else { var i = DFL.veb.indexOf(v); if (i === -1) DFL.veb.push(v); else DFL.veb.splice(i,1); }
    renderData();
  });
  $("dataReset").addEventListener("click", function(){
    DFL.q = ""; DFL.veb = []; DFL.mob = ""; DFL.org = ""; DFL.year = "";
    $("dQ").value = ""; $("dMob").value = ""; $("dOrg").value = ""; segSet("dYear",""); renderData();
  });
}


/* ===================== Tabs, theme, export ===================== */
function setTab(t){
  activeTab = t;
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-tab") === t); });
  document.querySelectorAll(".pane").forEach(function(p){ p.classList.toggle("on", p.id === "p-" + t); });
  store("mg_tab", t);
}
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function isDark(){ var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function applyTheme(t){
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  var b = document.getElementById("themeBtn"); if (b) b.innerHTML = isDark() ? SUN : MOON;
}
function svcRows(list){ return [["№","Qurum","Xidmətin adı","İnteqrasiya forması","Platforma","İnteqrasiya ili","İnteqrasiya ayı"]].concat(list.map(function(s,i){ return [i+1, s.org, s.name, s.form, s.plat, s.year ? +s.year : "", s.mon >= 0 ? MONTHS[s.mon] : ""]; })); }
function dataRows(list){ return [["№","Məlumat və ya sənədin adı","VEB kateqoriya","Mobile kateqoriya","Qurum","İl","Ay","PDF/Share"]].concat(list.map(function(d,i){ return [i+1, d.name, d.veb, d.mob, d.org, d.year ? +d.year : "", d.mon >= 0 ? MONTHS[d.mon] : "", d.pdf]; })); }
function writeXlsx(sheets, file){
  if (typeof XLSX === "undefined") { alert("Excel kitabxanası yüklənmədi. İnternet bağlantısını yoxlayın."); return; }
  var wb = XLSX.utils.book_new();
  sheets.forEach(function(s){
    var ws = XLSX.utils.aoa_to_sheet(s.rows);
    ws["!cols"] = s.rows[0].map(function(_, j){ var m = 8; s.rows.slice(0,80).forEach(function(r){ m = Math.max(m, String(r[j] == null ? "" : r[j]).length); }); return {wch: Math.min(m + 2, 70)}; });
    XLSX.utils.book_append_sheet(wb, ws, s.name);
  });
  XLSX.writeFile(wb, file);
}
function doExport(kind){
  if (kind === "svc") writeXlsx([{name:"Xidmətlər", rows:svcRows(S)}], "mygov_xidmetler.xlsx");
  else if (kind === "data") writeXlsx([{name:"Məlumatlar", rows:dataRows(D)}], "mygov_melumatlar.xlsx");
  else if (kind === "all") writeXlsx([{name:"Xidmətlər", rows:svcRows(S)},{name:"Məlumatlar", rows:dataRows(D)}], "mygov_hamisi.xlsx");
  else if (kind === "view") {
    if (activeTab === "svc") writeXlsx([{name:"Xidmətlər", rows:svcRows(svcFiltered())}], "mygov_xidmetler_filtr.xlsx");
    else writeXlsx([{name:"Məlumatlar", rows:dataRows(dataFiltered())}], "mygov_melumatlar_filtr.xlsx");
  }
}

function init(){
  tipEl = $("tip");
  renderKPIs(); renderCharts();
  bindSvc(); renderOrgPicker(); renderSvc();
  bindData(); renderData();
  document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ setTab(b.getAttribute("data-tab")); }); });
  var t = load("mg_tab"); if (t && $("p-" + t)) setTab(t);
}

(function(){
  applyTheme(load("mg_theme"));
  document.addEventListener("DOMContentLoaded", function(){
    applyTheme(load("mg_theme"));
    $("themeBtn").addEventListener("click", function(){
      var nx = isDark() ? "light" : "dark"; applyTheme(nx); store("mg_theme", nx);
    });
    $("expBtn").addEventListener("click", function(e){ e.stopPropagation(); $("expMenu").classList.toggle("open"); });
    $("expMenu").querySelectorAll("[data-exp]").forEach(function(b){ b.addEventListener("click", function(){ $("expMenu").classList.remove("open"); doExport(b.getAttribute("data-exp")); }); });
    document.addEventListener("click", function(){ $("expMenu").classList.remove("open"); $("orgPicker").classList.remove("open"); });
    document.addEventListener("keydown", function(e){ if (e.key === "Escape") { $("expMenu").classList.remove("open"); $("orgPicker").classList.remove("open"); } });
    loadAll();
  });
})();
</script>
